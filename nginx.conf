server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS: re-resolve service names so a restarted container keeps working
    # without reloading nginx. Static upstreams would pin the old IP until a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Khớp spring.servlet.multipart của file_service (5 MB/ảnh, 26 MB/request).
    # Mặc định 1m của nginx sẽ trả 413 trước khi request tới backend.
    client_max_body_size 26m;

    # Content is served from this origin only, plus the Google Identity script used by the login button.
    # Inline styles are required by the Ant Design runtime.
    # Sockets are same-origin (socket.ts uses window.location.origin), so the WebSocket sources are
    # pinned to this host instead of ws:/wss: for every host on the internet. A CSP source without a
    # port matches any port, so a non-standard nginx port still works.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com https://*.googleusercontent.com https://gw.alipayobjects.com; connect-src 'self' ws://$host wss://$host https://res.cloudinary.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This block listens on plain HTTP because TLS is terminated by the outer proxy; the browser
    # judges HSTS by its own connection, so the header still applies there. On direct HTTP access
    # the browser ignores it, which is the only case where this line is inert.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Vite emits content-hashed bundles, so they can be cached for a year.
    # 'expires' is used instead of add_header so the security headers above stay inherited.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # index.html must be revalidated, otherwise a new deployment stays invisible.
    location / {
        expires -1;
        try_files $uri /index.html;
    }

    location /api/ {
        # 'api_gateway' là tên service trong docker-compose
        set $api_gateway_upstream http://api_gateway:8888;
        proxy_pass $api_gateway_upstream$request_uri;

        # Các cấu hình header để Backend nhận diện đúng client
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Gateway dùng các header này cho rate-limit; nginx ghi đè nên client không tự đặt được.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        # Gateway tự trả 504 sau 90s (spring.cloud.gateway.httpclient.response-timeout).
        # Mặc định 60s của nginx sẽ cắt trước và trả 504 trần, mất mã lỗi của Gateway.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Socket.IO runs inside auth_service on its own port; the SPA connects to this origin.
    location /socket.io/ {
        set $auth_socket_upstream http://auth_service:8099;
        proxy_pass $auth_socket_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # gzip để tăng tốc
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
